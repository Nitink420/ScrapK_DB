<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Vendor - ScrapK DB</title>
    <link rel="stylesheet" href="/static/style.css">
</head>

<body>
    <div class="app-container">
        <!-- Sidebar Navigation -->
        <aside class="sidebar">
            <div class="brand">
                <img src="/static/scrapk.webp" alt="ScrapK Logo" class="brand-logo" style="width: 32px; height: 32px; border-radius: 8px; object-fit: cover; background: none; border: none; padding: 0;">
                <span class="brand-name">ScrapK Database</span>
            </div>
            <ul class="nav-menu">
                <li class="nav-item">
                    <a href="/">
                        <span class="nav-icon">📊</span>
                        <span>Dashboard</span>
                    </a>
                </li>
                <li class="nav-item">
                    <a href="/vendors">
                        <span class="nav-icon">👥</span>
                        <span>Vendors List</span>
                    </a>
                </li>
                <li class="nav-item active">
                    <a href="/add">
                        <span class="nav-icon">➕</span>
                        <span>Add Vendor</span>
                    </a>
                </li>
                <li class="nav-item">
                    <a href="/logout">
                        <span class="nav-icon">🚪</span>
                        <span>Logout</span>
                    </a>
                </li>
            </ul>
        </aside>

        <!-- Main Content Area -->
        <main class="main-content">
            <header class="page-header">
                <div class="page-title">
                    <h1>Add New Vendor</h1>
                    <p>Collect vendor profile details, recycling capabilities, and digital readiness metrics.</p>
                </div>
                <a href="/vendors" class="btn btn-secondary">
                    <span>⬅️ Back to List</span>
                </a>
            </header>

            <div class="card">
                <h2 class="card-title">📝 Vendor Registration Profile</h2>

                <form action="/add" method="POST">
                    <div class="form-grid">

                        <!-- Row 1 -->
                        <div class="form-group">
                            <label for="full_name">Full Name <span style="color: var(--danger);">*</span></label>
                            <input type="text" id="full_name" name="full_name" class="form-control"
                                placeholder="e.g. Rahul Sharma" required>
                        </div>

                        <div class="form-group">
                            <label for="business_name">Business / Shop Name</label>
                            <input type="text" id="business_name" name="business_name" class="form-control"
                                placeholder="e.g. Sharma Scrap Traders">
                        </div>

                        <!-- Row 2 -->
                        <div class="form-group">
                            <label for="mobile_no">Mobile Number <span style="color: var(--danger);">*</span></label>
                            <input type="text" id="mobile_no" name="mobile_no" class="form-control"
                                placeholder="e.g. +91 9876543210" required>
                        </div>

                        <div class="form-group">
                            <label for="email">Email Address</label>
                            <input type="email" id="email" name="email" class="form-control"
                                placeholder="e.g. rahul@example.com">
                        </div>

                        <!-- Row 3 -->
                        <div class="form-group">
                            <label for="working_area">Working / Collection Area</label>
                            <input type="text" id="working_area" name="working_area" class="form-control"
                                placeholder="e.g. Sector 62, Noida">
                        </div>

                        <div class="form-group">
                            <label for="experience_years">Experience (Years)</label>
                            <input type="number" id="experience_years" name="experience_years" min="0" max="80"
                                class="form-control" placeholder="e.g. 5">
                        </div>

                        <!-- Row 4 (Full Width) -->
                        <div class="form-group full-width">
                            <label for="full_address">Full Address</label>
                            <textarea id="full_address" name="full_address" class="form-control"
                                placeholder="Complete address of shop or warehouse..."></textarea>
                        </div>

                        <!-- Row 5 (Full Width Checkboxes) -->
                        <div class="form-group full-width">
                            <label>Scrap Material Categories Collected</label>
                            <div class="checkbox-grid">
                                <label class="checkbox-label">
                                    <input type="checkbox" name="scrap_paper" value="1">
                                    <span>📄 Paper / Cardboard</span>
                                </label>
                                <label class="checkbox-label">
                                    <input type="checkbox" name="scrap_plastic" value="1">
                                    <span>🧴 Plastic Materials</span>
                                </label>
                                <label class="checkbox-label">
                                    <input type="checkbox" name="scrap_metal" value="1">
                                    <span>🔩 Iron, Steel & Metals</span>
                                </label>
                                <label class="checkbox-label">
                                    <input type="checkbox" name="scrap_electronics" value="1">
                                    <span>🔌 E-Waste / Tech</span>
                                </label>
                                <label class="checkbox-label">
                                    <input type="checkbox" name="scrap_other" value="1">
                                    <span>📦 Others / Mixed</span>
                                </label>
                            </div>
                        </div>

                        <!-- Row 6 (Digital Engagement Indicators) -->
                        <div class="form-group">
                            <label>Does the vendor use a Smartphone?</label>
                            <div class="radio-group">
                                <label class="radio-label">
                                    <input type="radio" name="uses_smartphone" value="1">
                                    <span>Yes</span>
                                </label>
                                <label class="radio-label">
                                    <input type="radio" name="uses_smartphone" value="0" checked>
                                    <span>No</span>
                                </label>
                            </div>
                        </div>

                        <div class="form-group">
                            <label>Is WhatsApp available on their mobile?</label>
                            <div class="radio-group">
                                <label class="radio-label">
                                    <input type="radio" name="whatsapp_available" value="1">
                                    <span>Yes</span>
                                </label>
                                <label class="radio-label">
                                    <input type="radio" name="whatsapp_available" value="0" checked>
                                    <span>No</span>
                                </label>
                            </div>
                        </div>

                        <div class="form-group full-width">
                            <label>Is the vendor interested in using our mobile application?</label>
                            <div class="radio-group">
                                <label class="radio-label">
                                    <input type="radio" name="interested_in_app" value="1">
                                    <span>Yes, highly interested</span>
                                </label>
                                <label class="radio-label">
                                    <input type="radio" name="interested_in_app" value="0" checked>
                                    <span>No / Neutral</span>
                                </label>
                            </div>
                        </div>

                        <!-- Submit Buttons -->
                        <div class="form-group full-width" style="display: flex; gap: 1rem; margin-top: 1rem;">
                            <button type="submit" class="btn btn-primary">💾 Register Vendor</button>
                            <button type="reset" class="btn btn-secondary">🔄 Reset Form</button>
                        </div>
                    </div>
                </form>
            </div>
        </main>
    </div>
</body>

</html>
