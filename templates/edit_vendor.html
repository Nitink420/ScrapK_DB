<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Vendor - ScrapK DB</title>
    <link rel="stylesheet" href="/static/style.css">
</head>

<body>
    <div class="app-container">
        <!-- Sidebar Navigation -->
        <aside class="sidebar">
            <div class="brand">
                <img src="/static/scrapk.webp" alt="ScrapK Logo" class="brand-logo" style="width: 32px; height: 32px; border-radius: 8px; object-fit: cover; background: none; border: none; padding: 0;">
                <span class="brand-name">ScrapK Database</span>
            </div>
            <ul class="nav-menu">
                <li class="nav-item">
                    <a href="/">
                        <span class="nav-icon">📊</span>
                        <span>Dashboard</span>
                    </a>
                </li>
                <li class="nav-item active">
                    <a href="/vendors">
                        <span class="nav-icon">👥</span>
                        <span>Vendors List</span>
                    </a>
                </li>
                <li class="nav-item">
                    <a href="/add">
                        <span class="nav-icon">➕</span>
                        <span>Add Vendor</span>
                    </a>
                </li>
                <li class="nav-item">
                    <a href="/logout">
                        <span class="nav-icon">🚪</span>
                        <span>Logout</span>
                    </a>
                </li>
            </ul>
        </aside>

        <!-- Main Content Area -->
        <main class="main-content">
            <header class="page-header">
                <div class="page-title">
                    <h1>Edit Vendor Profile</h1>
                    <p>Modify vendor profile details, recycling capabilities, and digital readiness metrics.</p>
                </div>
                <a href="/vendors" class="btn btn-secondary">
                    <span>⬅️ Back to List</span>
                </a>
            </header>

            <div class="card">
                <h2 class="card-title">✏️ Update Profile: {{ vendor.full_name }}</h2>

                <form action="/edit/{{ vendor.id }}" method="POST">
                    <div class="form-grid">

                        <!-- Row 1 -->
                        <div class="form-group">
                            <label for="full_name">Full Name <span style="color: var(--danger);">*</span></label>
                            <input type="text" id="full_name" name="full_name" class="form-control"
                                value="{{ vendor.full_name }}" required>
                        </div>

                        <div class="form-group">
                            <label for="business_name">Business / Shop Name</label>
                            <input type="text" id="business_name" name="business_name" class="form-control"
                                value="{{ vendor.business_name or '' }}">
                        </div>

                        <!-- Row 2 -->
                        <div class="form-group">
                            <label for="mobile_no">Mobile Number <span style="color: var(--danger);">*</span></label>
                            <input type="text" id="mobile_no" name="mobile_no" class="form-control"
                                value="{{ vendor.mobile_no }}" required>
                        </div>

                        <div class="form-group">
                            <label for="email">Email Address</label>
                            <input type="email" id="email" name="email" class="form-control"
                                value="{{ vendor.email or '' }}">
                        </div>

                        <!-- Row 3 -->
                        <div class="form-group">
                            <label for="working_area">Working / Collection Area</label>
                            <input type="text" id="working_area" name="working_area" class="form-control"
                                value="{{ vendor.working_area or '' }}">
                        </div>

                        <div class="form-group">
                            <label for="experience_years">Experience (Years)</label>
                            <input type="number" id="experience_years" name="experience_years" min="0" max="80"
                                class="form-control" value="{{ vendor.experience_years or '' }}">
                        </div>

                        <!-- Row 4 (Full Width) -->
                        <div class="form-group full-width">
                            <label for="full_address">Full Address</label>
                            <textarea id="full_address" name="full_address"
                                class="form-control">{{ vendor.full_address or '' }}</textarea>
                        </div>

                        <!-- Row 5 (Full Width Checkboxes) -->
                        <div class="form-group full-width">
                            <label>Scrap Material Categories Collected</label>
                            <div class="checkbox-grid">
                                <label class="checkbox-label">
                                    <input type="checkbox" name="scrap_paper" value="1" {% if vendor.scrap_paper
                                        %}checked{% endif %}>
                                    <span>📄 Paper / Cardboard</span>
                                </label>
                                <label class="checkbox-label">
                                    <input type="checkbox" name="scrap_plastic" value="1" {% if vendor.scrap_plastic
                                        %}checked{% endif %}>
                                    <span>🧴 Plastic Materials</span>
                                </label>
                                <label class="checkbox-label">
                                    <input type="checkbox" name="scrap_metal" value="1" {% if vendor.scrap_metal
                                        %}checked{% endif %}>
                                    <span>🔩 Iron, Steel & Metals</span>
                                </label>
                                <label class="checkbox-label">
                                    <input type="checkbox" name="scrap_electronics" value="1" {% if
                                        vendor.scrap_electronics %}checked{% endif %}>
                                    <span>🔌 E-Waste / Tech</span>
                                </label>
                                <label class="checkbox-label">
                                    <input type="checkbox" name="scrap_other" value="1" {% if vendor.scrap_other
                                        %}checked{% endif %}>
                                    <span>📦 Others / Mixed</span>
                                </label>
                            </div>
                        </div>

                        <!-- Row 6 (Digital Engagement Indicators) -->
                        <div class="form-group">
                            <label>Does the vendor use a Smartphone?</label>
                            <div class="radio-group">
                                <label class="radio-label">
                                    <input type="radio" name="uses_smartphone" value="1" {% if vendor.uses_smartphone
                                        %}checked{% endif %}>
                                    <span>Yes</span>
                                </label>
                                <label class="radio-label">
                                    <input type="radio" name="uses_smartphone" value="0" {% if not
                                        vendor.uses_smartphone %}checked{% endif %}>
                                    <span>No</span>
                                </label>
                            </div>
                        </div>

                        <div class="form-group">
                            <label>Is WhatsApp available on their mobile?</label>
                            <div class="radio-group">
                                <label class="radio-label">
                                    <input type="radio" name="whatsapp_available" value="1" {% if
                                        vendor.whatsapp_available %}checked{% endif %}>
                                    <span>Yes</span>
                                </label>
                                <label class="radio-label">
                                    <input type="radio" name="whatsapp_available" value="0" {% if not
                                        vendor.whatsapp_available %}checked{% endif %}>
                                    <span>No</span>
                                </label>
                            </div>
                        </div>

                        <div class="form-group full-width">
                            <label>Is the vendor interested in using our mobile application?</label>
                            <div class="radio-group">
                                <label class="radio-label">
                                    <input type="radio" name="interested_in_app" value="1" {% if
                                        vendor.interested_in_app %}checked{% endif %}>
                                    <span>Yes, highly interested</span>
                                </label>
                                <label class="radio-label">
                                    <input type="radio" name="interested_in_app" value="0" {% if not
                                        vendor.interested_in_app %}checked{% endif %}>
                                    <span>No / Neutral</span>
                                </label>
                            </div>
                        </div>

                        <!-- Submit Buttons -->
                        <div class="form-group full-width" style="display: flex; gap: 1rem; margin-top: 1rem;">
                            <button type="submit" class="btn btn-primary">💾 Update Profile</button>
                            <a href="/vendors" class="btn btn-secondary">❌ Cancel</a>
                        </div>
                    </div>
                </form>
            </div>
        </main>
    </div>
</body>

</html>
